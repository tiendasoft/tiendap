<style>
* {
    box-sizing: border-box;
}

body {

header {

.buscar {

}

.categorias {

.categoria-btn {

}

.estado {

.barra-carrito {

.btn-carrito {

}

.productos {

}

.producto {

.categoria-producto {

.descripcion {

}

.btn {

}

}

.btn-carrito-producto {

}

.btn-whatsapp {

}

.btn-eliminar {

    color: white;
}

.btn-editar {
    background: #ffc107;
    color: #111;
}

.btn-principal {
    background: #111;
    color: white;
}

.btn-secundario {
    background: #777;
    color: white;
}

.carrito-panel {
    background: white;
    border-radius: 10px;
    padding: 20px;
    margin: 20px 0;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

.carrito-item {
    border-bottom: 1px solid #ccc;

}

.carrito-item:last-child {
    border-bottom: none;
}

.carrito-nombre {

    font-weight: bold;
}

.carrito-precio {

}

.controles-cantidad {

.controles-cantidad button {

.cantidad {

}

.subtotal {

}

.total-carrito {

}

.botones-carrito {

/* LOGIN */

.modal {

.modal-contenido {

.campo {

}

.campo label {

}

.campo input,
.campo textarea,

.campo textarea {

.botones {

.mensaje {

/* ADMIN */

.admin-panel {

.admin-panel h2 {

.lista-categorias-admin {

.categoria-admin-item {

.lista-admin-productos {

.admin-producto {

.admin-producto strong {

.preview {

@media (max-width: 600px) {

}
</style>
</head>

<header>

</header>

<div id="avisoTienda" class="aviso">

<main class="contenedor">

<!-- PANEL ADMIN -->

</section>

<script>

const URL_NPOINT =
"https://api.npoint.io/9ce9dc79ca3d9a1e1848";

const NUMERO_WHATSAPP =
"5492634937407";

const CONTRASENA_INICIAL =
"brian";

let productos = [];

let configuracion = {
    nombreTienda: "TIENDA",
    subtitulo: "Productos para tu hogar y tecnología",
    aviso: "Luego de realizar el pedido comunicarse por WhatsApp.",
    mostrarStock: true,
    categoriasActivas: {},
    contrasenaAdmin: CONTRASENA_INICIAL
};

let categoriaSeleccionada = "Todas";

let productoEditandoId = null;

let carrito = [];


/* =========================
   FUNCIONES GENERALES
========================= */

function generarId() {

    if (
        window.crypto &&
        typeof window.crypto.randomUUID === "function"
    ) {
        return window.crypto.randomUUID();
    }

    return "prod_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2, 10);
}


function repararIds() {

    const ids = new Set();

    productos.forEach(producto => {

        if (
            !producto.id ||
            ids.has(producto.id)
        ) {
            producto.id = generarId();
        }

        ids.add(producto.id);
    });
}


function formatearPrecio(valor) {

    const numero = Number(valor) || 0;

    return numero.toLocaleString("es-AR");
}


function tieneControlStock(producto) {

    return (
        producto.stock !== "" &&
        producto.stock !== null &&
        producto.stock !== undefined &&
        !isNaN(Number(producto.stock))
    );
}


function obtenerStock(producto) {

    if (!tieneControlStock(producto)) {
        return null;
    }

    return Math.max(0, Number(producto.stock));
}


/* =========================
   CARGAR Y GUARDAR NPOINT
========================= */

async function cargarDesdeNPoint() {

    const respuesta = await fetch(
        URL_NPOINT + "?t=" + Date.now()
    );

    if (!respuesta.ok) {
        throw new Error(
            "No se pudo leer nPoint."
        );
    }

    return await respuesta.json();
}


async function guardarDatosEnNPoint(
    productosGuardar,
    configuracionGuardar
) {

    repararIds();

    const datos = {
        productos: productosGuardar,
        configuracion: configuracionGuardar,
        tiendaInicializada: true
    };

    const respuesta = await fetch(
        URL_NPOINT,
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(datos)
        }
    );

    if (!respuesta.ok) {
        throw new Error(
            "nPoint no aceptó el guardado."
        );
    }

    const verificacion =
        await cargarDesdeNPoint();

    if (
        !verificacion ||
        !Array.isArray(verificacion.productos)
    ) {
        throw new Error(
            "No se pudo verificar el guardado."
        );
    }

    return verificacion;
}


async function guardarEnNPoint() {

    return await guardarDatosEnNPoint(
        productos,
        configuracion
    );
}


/* =========================
   CONFIGURACIÓN
========================= */

function completarConfiguracion() {

    if (
        !configuracion ||
        typeof configuracion !== "object"
    ) {
        configuracion = {};
    }

    configuracion.nombreTienda = "TIENDA";

    if (
        typeof configuracion.subtitulo !== "string"
    ) {
        configuracion.subtitulo =
            "Productos para tu hogar y tecnología";
    }

    if (
        typeof configuracion.aviso !== "string"
    ) {
        configuracion.aviso =
            "Luego de realizar el pedido comunicarse por WhatsApp.";
    }

    if (
        typeof configuracion.mostrarStock !== "boolean"
    ) {
        configuracion.mostrarStock = true;
    }

    if (
        !configuracion.categoriasActivas ||
        typeof configuracion.categoriasActivas !== "object"
    ) {
        configuracion.categoriasActivas = {};
    }

    if (
        typeof configuracion.contrasenaAdmin !== "string" ||
        !configuracion.contrasenaAdmin
    ) {
        configuracion.contrasenaAdmin =
            CONTRASENA_INICIAL;
    }

    /*
       IMPORTANTE:
       No se crean categorías fijas.
       Se conservan las existentes y se agregan
       automáticamente las categorías que ya tengan
       los productos.
    */

    productos.forEach(producto => {

        if (
            producto.categoria &&
            typeof producto.categoria === "string"
        ) {

            const categoria =
                producto.categoria.trim();

            if (categoria) {

                if (
                    configuracion
                        .categoriasActivas[categoria]
                    === undefined
                ) {
                    configuracion
                        .categoriasActivas[categoria]
                    = true;
                }
            }
        }
    });
}


function aplicarConfiguracion() {

    /*
       El título visible queda siempre como TIENDA.
    */

    document.getElementById(
        "tituloTienda"
    ).textContent = "TIENDA";

    document.title = "TIENDA";

    document
        .querySelector('meta[property="og:title"]')
        .setAttribute("content", "TIENDA");

    document
        .querySelector('meta[property="og:site_name"]')
        .setAttribute("content", "TIENDA");

    document
        .querySelector('meta[name="twitter:title"]')
        .setAttribute("content", "TIENDA");

    document.getElementById(
        "subtituloTienda"
    ).textContent =
        configuracion.subtitulo || "";

    document.getElementById(
        "avisoTienda"
    ).textContent =
        configuracion.aviso || "";

    document.getElementById(
        "nombreTiendaAdmin"
    ).value = "TIENDA";

    document.getElementById(
        "subtituloAdmin"
    ).value =
        configuracion.subtitulo || "";

    document.getElementById(
        "avisoAdmin"
    ).value =
        configuracion.aviso || "";

    document.getElementById(
        "mostrarStockAdmin"
    ).checked =
        configuracion.mostrarStock !== false;
}


/* =========================
   CATEGORÍAS
========================= */

function obtenerCategorias() {

    const categorias = [];

    if (
        configuracion.categoriasActivas &&
        typeof configuracion.categoriasActivas === "object"
    ) {

        Object.keys(
            configuracion.categoriasActivas
        ).forEach(categoria => {

            if (
                configuracion
                    .categoriasActivas[categoria] !== false
            ) {

                if (!categorias.includes(categoria)) {
                    categorias.push(categoria);
                }
            }
        });
    }

    /*
       También se conservan categorías que estén
       utilizadas por productos.
    */

    productos.forEach(producto => {

        if (
            producto.categoria &&
            typeof producto.categoria === "string"
        ) {

            const categoria =
                producto.categoria.trim();

            if (
                categoria &&
                !categorias.includes(categoria)
            ) {
                categorias.push(categoria);
            }
        }
    });

    return categorias;
}


function mostrarCategorias() {

    const contenedor =
        document.getElementById("categorias");

function cargarCategoriasFormulario() {

        document.getElementById(
            "categoriaProducto"
        );

    const valorAnterior =
        select.value;

    select.innerHTML =
        '<option value="">Sin categoría</option>';

function mostrarCategoriasAdmin() {

    const contenedor =
        document.getElementById(
            "listaCategoriasAdmin"
        );

    contenedor.innerHTML = "";

    const categorias =
        obtenerCategorias();

    if (categorias.length === 0) {

        const mensaje =
            document.createElement("p");

        mensaje.textContent =
            "No hay categorías creadas.";

        contenedor.appendChild(
            mensaje
        );

        return;
    }

    categorias.forEach(
        categoria => {

            const fila =
                document.createElement("div");

            fila.className =
                "categoria-admin-item";

            const nombre =
                document.createElement("span");

            nombre.textContent =
                categoria;

            const boton =
                document.createElement("button");

            boton.type = "button";
            boton.className =
                "btn btn-eliminar";

            boton.textContent =
                "Eliminar";

            boton.addEventListener(
                "click",
                async () => {

                    const confirmar =
                        confirm(
                            "¿Querés eliminar la categoría " +
                            categoria +
                            "?"
                        );

                    if (!confirmar) {
                        return;
                    }

                    /*
                       No modificamos la categoría de los
                       productos. Solamente la quitamos
                       como categoría activa.
                    */

                    delete configuracion
                        .categoriasActivas[categoria];

                    try {

                        await guardarEnNPoint();

                        mostrarCategoriasAdmin();
                        cargarCategoriasFormulario();
                        mostrarCategorias();

                        document.getElementById(
                            "mensajeCategorias"
                        ).textContent =
                            "Categoría eliminada.";

                    } catch (error) {

                        console.error(error);

                        document.getElementById(
                            "mensajeCategorias"
                        ).textContent =
                            "No se pudo eliminar la categoría.";
                    }
                }
            );

            fila.appendChild(nombre);
            fila.appendChild(boton);

            contenedor.appendChild(fila);
        }
    );
}


/* =========================
   MOSTRAR PRODUCTOS
========================= */

function mostrarProductos() {

    const contenedor =
        document.getElementById("productos");

    const busqueda =
        document.getElementById(
            "buscador"
        ).value
        .trim()
        .toLowerCase();

    contenedor.innerHTML = "";

    const filtrados =
        productos.filter(producto => {

            const nombre =
                String(
                    producto.nombre || ""
                ).toLowerCase();

            const descripcion =
                String(
                    producto.descripcion || ""
                ).toLowerCase();

            const categoria =
                String(
                    producto.categoria || ""
                ).toLowerCase();

            const coincideBusqueda =
                !busqueda ||
                nombre.includes(busqueda) ||
                descripcion.includes(busqueda) ||
                categoria.includes(busqueda);

            const coincideCategoria =
                categoriaSeleccionada === "Todas" ||
                producto.categoria ===
                    categoriaSeleccionada;

            return (
                coincideBusqueda &&
                coincideCategoria
            );
        });

    if (filtrados.length === 0) {

        const mensaje =
            document.createElement("p");

        mensaje.textContent =
            "No se encontraron productos.";

        contenedor.appendChild(
            mensaje
        );

        return;
    }

    filtrados.forEach(
        producto => {

            const tarjeta =
                document.createElement("article");

            tarjeta.className =
                "producto";

            const imagen =
                document.createElement("img");

            imagen.src =
                producto.imagen || "";

            imagen.alt =
                "Imagen de " +
                producto.nombre;

            tarjeta.appendChild(imagen);

            const nombre =
                document.createElement("h2");

            nombre.textContent =
                producto.nombre || "";

            tarjeta.appendChild(nombre);

            const precio =
                document.createElement("div");

            precio.className =
                "precio";

            precio.textContent =
                "$" +
                formatearPrecio(
                    producto.precio
                );

            tarjeta.appendChild(precio);

            if (producto.categoria) {

                const categoria =
                    document.createElement("div");

                categoria.className =
                    "categoria-producto";

                categoria.textContent =
                    "Categoría: " +
                    producto.categoria;

                tarjeta.appendChild(
                    categoria
                );
            }

            if (producto.descripcion) {

                const descripcion =
                    document.createElement("div");

                descripcion.className =
                    "descripcion";

                descripcion.textContent =
                    producto.descripcion;

                tarjeta.appendChild(
                    descripcion
                );
            }

            const stock =
                obtenerStock(producto);

            let estaAgotado = false;

            if (
                configuracion.mostrarStock &&
                stock !== null
            ) {

                const textoStock =
                    document.createElement("div");

                textoStock.className =
                    "stock";

                if (stock <= 0) {

                    textoStock.textContent =
                        "Agotado";

                    estaAgotado = true;

                } else {

                    textoStock.textContent =
                        "Stock disponible: " +
                        stock;
                }

                tarjeta.appendChild(
                    textoStock
                );
            }

            const botones =
                document.createElement("div");

            botones.className =
                "botones-producto";

            const botonCarrito =
                document.createElement("button");

            botonCarrito.type = "button";
            botonCarrito.className =
                "btn btn-carrito-producto";

            botonCarrito.textContent =
                estaAgotado
                    ? "Agotado"
                    : "Agregar al carrito";

            botonCarrito.disabled =
                estaAgotado;

            botonCarrito.addEventListener(
                "click",
                () => {
                    agregarAlCarrito(
                        producto.id
                    );
                }
            );

            botones.appendChild(
                botonCarrito
            );

            const botonWhatsApp =
                document.createElement("button");

            botonWhatsApp.type = "button";
            botonWhatsApp.className =
                "btn btn-whatsapp";

            botonWhatsApp.textContent =
                "Consultar por WhatsApp";

            botonWhatsApp.addEventListener(
                "click",
                () => {
                    consultarWhatsApp(
                        producto.id
                    );
                }
            );

            botones.appendChild(
                botonWhatsApp
            );

            tarjeta.appendChild(
                botones
            );

            contenedor.appendChild(
                tarjeta
            );
        }
    );
}

/* =========================
   CARRITO
========================= */

function obtenerCantidadCarrito(id) {

    const item =
        carrito.find(
            item => item.id === id
        );

    return item
        ? item.cantidad
        : 0;
}


function agregarAlCarrito(id) {

    const producto =
        productos.find(
            p => p.id === id
        );

    if (!producto) {
        return;
    }

    const stock =
        obtenerStock(producto);

    const cantidadActual =
        obtenerCantidadCarrito(id);

    if (
        stock !== null &&
        cantidadActual >= stock
    ) {

        document.getElementById(
            "mensajeCarrito"
        ).textContent =
            "No hay más stock disponible de " +
            producto.nombre +
            ".";

        abrirCarrito();

        return;
    }

    const existente =
        carrito.find(
            item => item.id === id
        );

    if (existente) {

        existente.cantidad++;

    } else {

        carrito.push({
            id: id,
            cantidad: 1
        });
    }

    mostrarCarrito();

    document.getElementById(
        "mensajeCarrito"
    ).textContent =
        producto.nombre +
        " agregado al carrito.";
}


function cambiarCantidadCarrito(
    id,
    cambio
) {

    const item =
        carrito.find(
            item => item.id === id
        );

    const producto =
        productos.find(
            p => p.id === id
        );

    if (!item || !producto) {
        return;
    }

    const nuevaCantidad =
        item.cantidad + cambio;

    const stock =
        obtenerStock(producto);

    if (
        nuevaCantidad > 0 &&
        stock !== null &&
        nuevaCantidad > stock
    ) {

        document.getElementById(
            "mensajeCarrito"
        ).textContent =
            "No podés superar el stock disponible.";

        return;
    }

    if (nuevaCantidad <= 0) {

        carrito =
            carrito.filter(
                item => item.id !== id
            );

    } else {

        item.cantidad =
            nuevaCantidad;
    }

    mostrarCarrito();
}


function quitarDelCarrito(id) {

    carrito =
        carrito.filter(
            item => item.id !== id
        );

    mostrarCarrito();
}


function vaciarCarrito() {

    carrito = [];

    mostrarCarrito();

    document.getElementById(
        "mensajeCarrito"
    ).textContent =
        "Carrito vacío.";
}


function calcularTotalCarrito() {

    return carrito.reduce(
        (total, item) => {

            const producto =
                productos.find(
                    p => p.id === item.id
                );

            if (!producto) {
                return total;
            }

            return total +
                (
                    Number(producto.precio) *
                    item.cantidad
                );

        },
        0
    );
}


function mostrarCarrito() {

    const lista =
        document.getElementById(
            "listaCarrito"
        );

    lista.innerHTML = "";

    const boton =
        document.getElementById(
            "btnAbrirCarrito"
        );

    const cantidadTotal =
        carrito.reduce(
            (total, item) =>
                total + item.cantidad,
            0
        );

    boton.textContent =
        "Carrito (" +
        cantidadTotal +
        ")";

    if (carrito.length === 0) {

        const mensaje =
            document.createElement("p");

        mensaje.textContent =
            "El carrito está vacío.";

        lista.appendChild(
            mensaje
        );

        document.getElementById(
            "totalCarrito"
        ).textContent =
            "Total: $0";

        return;
    }

    carrito.forEach(
        item => {

            const producto =
                productos.find(
                    p => p.id === item.id
                );

            if (!producto) {
                return;
            }

            const contenedor =
                document.createElement("div");

            contenedor.className =
                "carrito-item";

            const nombre =
                document.createElement("div");

            nombre.className =
                "carrito-nombre";

            nombre.textContent =
                producto.nombre;

            contenedor.appendChild(
                nombre
            );

            const precio =
                document.createElement("div");

            precio.className =
                "carrito-precio";

            precio.textContent =
                "Precio unitario: $" +
                formatearPrecio(
                    producto.precio
                );

            contenedor.appendChild(
                precio
            );

            const controles =
                document.createElement("div");

            controles.className =
                "controles-cantidad";

            const botonMenos =
                document.createElement("button");

            botonMenos.type = "button";
            botonMenos.textContent = "−";
            botonMenos.setAttribute(
                "aria-label",
                "Disminuir cantidad de " +
                producto.nombre
            );

            botonMenos.addEventListener(
                "click",
                () => {
                    cambiarCantidadCarrito(
                        producto.id,
                        -1
                    );
                }
            );

            controles.appendChild(
                botonMenos
            );

            const cantidad =
                document.createElement("span");

            cantidad.className =
                "cantidad";

            cantidad.textContent =
                item.cantidad;

            cantidad.setAttribute(
                "aria-label",
                "Cantidad " +
                item.cantidad
            );

            controles.appendChild(
                cantidad
            );

            const botonMas =
                document.createElement("button");

            botonMas.type = "button";
            botonMas.textContent = "+";
            botonMas.setAttribute(
                "aria-label",
                "Aumentar cantidad de " +
                producto.nombre
            );

            botonMas.addEventListener(
                "click",
                () => {
                    cambiarCantidadCarrito(
                        producto.id,
                        1
                    );
                }
            );

            controles.appendChild(
                botonMas
            );

            contenedor.appendChild(
                controles
            );

            const subtotal =
                document.createElement("div");

            subtotal.className =
                "subtotal";

            const valorSubtotal =
                Number(producto.precio) *
                item.cantidad;

            subtotal.textContent =
                "Subtotal: $" +
                formatearPrecio(
                    valorSubtotal
                );

            contenedor.appendChild(
                subtotal
            );

            const quitar =
                document.createElement("button");

            quitar.type = "button";
            quitar.className =
                "btn btn-eliminar";

            quitar.textContent =
                "Quitar del carrito";

            quitar.addEventListener(
                "click",
                () => {
                    quitarDelCarrito(
                        producto.id
                    );
                }
            );

            contenedor.appendChild(
                quitar
            );

            lista.appendChild(
                contenedor
            );
        }
    );

    document.getElementById(
        "totalCarrito"
    ).textContent =
        "Total: $" +
        formatearPrecio(
            calcularTotalCarrito()
        );
}

/* =========================
   ENVIAR CARRITO WHATSAPP
========================= */

async function enviarCarritoWhatsApp() {

    if (carrito.length === 0) {

        document.getElementById(
            "mensajeCarrito"
        ).textContent =
            "El carrito está vacío.";

        return;
    }

    /*
       Abrimos una ventana inmediatamente para
       evitar que el navegador bloquee WhatsApp
       después del await.
    */

    const ventana =
        window.open(
            "about:blank",
            "_blank"
        );

    const boton =
        document.getElementById(
            "enviarCarritoWhatsApp"
        );

    boton.disabled = true;

    document.getElementById(
        "mensajeCarrito"
    ).textContent =
        "Verificando stock y preparando el pedido...";

    try {

        /*
           Volvemos a leer nPoint justo antes
           de descontar el stock.
        */

        const datosActuales =
            await cargarDesdeNPoint();

        const productosActuales =
            Array.isArray(
                datosActuales.productos
            )
                ? datosActuales.productos
                : [];

        const configuracionActual =
            datosActuales.configuracion ||
            configuracion;

        const productosActualizados =
            productosActuales.map(
                producto => ({
                    ...producto
                })
            );

        const detalles = [];

        let total = 0;

        /*
           Verificación completa.
        */

        for (
            const item of carrito
        ) {

            const producto =
                productosActualizados.find(
                    p => p.id === item.id
                );

            if (!producto) {

                throw new Error(
                    "El producto " +
                    item.id +
                    " ya no existe."
                );
            }

            const stock =
                obtenerStock(producto);

            if (
                stock !== null &&
                item.cantidad > stock
            ) {

                throw new Error(
                    "No hay suficiente stock de " +
                    producto.nombre +
                    ". Stock actual: " +
                    stock
                );
            }

            const subtotal =
                Number(producto.precio) *
                item.cantidad;

            total += subtotal;

            detalles.push({
                producto: producto,
                cantidad: item.cantidad,
                subtotal: subtotal
            });
        }

        /*
           Ahora descontamos stock solamente
           de los productos que tienen stock
           controlado.
        */

        detalles.forEach(
            detalle => {

                const producto =
                    detalle.producto;

                const stock =
                    obtenerStock(producto);

                if (stock !== null) {

                    producto.stock =
                        stock -
                        detalle.cantidad;
                }
            }
        );

        /*
           Guardamos usando la información más
           reciente que acabamos de leer.
        */

        const datosGuardados =
            await guardarDatosEnNPoint(
                productosActualizados,
                configuracionActual
            );

        /*
           Verificamos que el guardado haya quedado
           realmente en nPoint.
        */

        const productosVerificados =
            Array.isArray(
                datosGuardados.productos
            )
                ? datosGuardados.productos
                : [];

        for (
            const detalle of detalles
        ) {

            const productoVerificado =
                productosVerificados.find(
                    p =>
                        p.id ===
                        detalle.producto.id
                );

            if (!productoVerificado) {

                throw new Error(
                    "No se pudo verificar el producto " +
                    detalle.producto.nombre
                );
            }
        }

        /*
           Actualizamos la tienda local.
        */

        productos =
            productosVerificados;

        configuracion =
            datosGuardados.configuracion ||
            configuracion;

        completarConfiguracion();
        aplicarConfiguracion();

        mostrarCategorias();
        cargarCategoriasFormulario();
        mostrarProductos();
        cargarProductosAdmin();

        /*
           Armamos el mensaje de WhatsApp.
        */

        let mensaje =
            "PEDIDO DESDE LA TIENDA\n\n";

        detalles.forEach(
            detalle => {

                mensaje +=
                    "Producto: " +
                    detalle.producto.nombre +
                    "\n";

                mensaje +=
                    "Cantidad: " +
                    detalle.cantidad +
                    "\n";

                mensaje +=
                    "Precio unitario: $" +
                    formatearPrecio(
                        detalle.producto.precio
                    ) +
                    "\n";

                mensaje +=
                    "Subtotal: $" +
                    formatearPrecio(
                        detalle.subtotal
                    ) +
                    "\n\n";
            }
        );

        mensaje +=
            "TOTAL: $" +
            formatearPrecio(total);

        const url =
            "https://wa.me/" +
            NUMERO_WHATSAPP +
            "?text=" +
            encodeURIComponent(
                mensaje
            );

        carrito = [];

        mostrarCarrito();

        document.getElementById(
            "mensajeCarrito"
        ).textContent =
            "Pedido preparado correctamente.";

        if (ventana) {

            ventana.location.href =
                url;

        } else {

            window.location.href =
                url;
        }

    } catch (error) {

        console.error(error);

        if (ventana) {
            ventana.close();
        }

        /*
           Si hubo un problema de stock,
           volvemos a cargar los datos reales.
        */

        try {

            const datos =
                await cargarDesdeNPoint();

            if (
                datos &&
                Array.isArray(
                    datos.productos
                )
            ) {

                productos =
                    datos.productos;

                configuracion =
                    datos.configuracion ||
                    configuracion;

                completarConfiguracion();
                aplicarConfiguracion();

                mostrarCategorias();
                cargarCategoriasFormulario();
                mostrarProductos();
                cargarProductosAdmin();
                mostrarCarrito();
            }

        } catch (errorRecarga) {

            console.error(
                errorRecarga
            );
        }

        document.getElementById(
            "mensajeCarrito"
        ).textContent =
            "No se pudo enviar el pedido. " +
            error.message;

    } finally {

        boton.disabled = false;
    }
}

        );

    const nombre =
        input.value.trim();

    if (!nombre) {

        document.getElementById(
            "mensajeCategorias"
        ).textContent =
            "Escribí un nombre para la categoría.";

        input.focus();

        return;
    }

    if (
        obtenerCategorias()
            .some(
                categoria =>
                    categoria.toLowerCase() ===
                    nombre.toLowerCase()
            )
    ) {

        document.getElementById(
            "mensajeCategorias"
        ).textContent =
            "Esa categoría ya existe.";

        input.focus();

        return;
    }

    configuracion
        .categoriasActivas[nombre] =
        true;

    try {

        await guardarEnNPoint();

        input.value = "";

        mostrarCategoriasAdmin();
        cargarCategoriasFormulario();
        mostrarCategorias();

        document.getElementById(
            "mensajeCategorias"
        ).textContent =
            "Categoría agregada correctamente.";

        input.focus();

    } catch (error) {

        console.error(error);

        delete configuracion
            .categoriasActivas[nombre];

        document.getElementById(
            "mensajeCategorias"
        ).textContent =
            "No se pudo guardar la categoría.";
    }
}

/* =========================
   PRODUCTOS ADMIN
========================= */

function cargarProductosAdmin() {

    const contenedor =
        document.getElementById(
            "listaProductosAdmin"
        );

    contenedor.innerHTML = "";

    if (productos.length === 0) {

        const mensaje =
            document.createElement("p");

        mensaje.textContent =
            "No hay productos cargados.";

        contenedor.appendChild(
            mensaje
        );

        return;
    }

    productos.forEach(
        producto => {

            const elemento =
                document.createElement("div");

            elemento.className =
                "admin-producto";

            const nombre =
                document.createElement("strong");

            nombre.textContent =
                producto.nombre;

            elemento.appendChild(nombre);

            const precio =
                document.createElement("div");

            precio.textContent =
                "Precio: $" +
                formatearPrecio(
                    producto.precio
                );

            elemento.appendChild(precio);

            if (producto.categoria) {

                const categoria =
                    document.createElement("div");

                categoria.textContent =
                    "Categoría: " +
                    producto.categoria;

                elemento.appendChild(
                    categoria
                );
            }

            if (
                tieneControlStock(producto)
            ) {

                const stock =
                    document.createElement("div");

                stock.textContent =
                    "Stock: " +
                    obtenerStock(producto);

                elemento.appendChild(
                    stock
                );
            }

            const botones =
                document.createElement("div");

            botones.className =
                "botones";

            const editar =
                document.createElement("button");

            editar.type = "button";
            editar.className =
                "btn btn-editar";

            editar.textContent =
                "Editar";

            editar.addEventListener(
                "click",
                () => {
                    editarProducto(
                        producto.id
                    );
                }
            );

            botones.appendChild(
                editar
            );

            const eliminar =
                document.createElement("button");

            eliminar.type = "button";
            eliminar.className =
                "btn btn-eliminar";

            eliminar.textContent =
                "Eliminar";

            eliminar.addEventListener(
                "click",
                () => {
                    eliminarProducto(
                        producto.id
                    );
                }
            );

            botones.appendChild(
                eliminar
            );

            elemento.appendChild(
                botones
            );

            contenedor.appendChild(
                elemento
            );
        }
    );
}

    }

    productoEditandoId = id;

        "tituloFormularioProducto"
    ).textContent =

    document.getElementById(
        "nombreProducto"
    ).value =

    document.getElementById(
        "precioProducto"
    ).value =
        producto.precio || "";

    document.getElementById(
        "descripcionProducto"
    ).value =
        producto.descripcion || "";

    cargarCategoriasFormulario();

    document.getElementById(
        "categoriaProducto"
    ).value =
        producto.categoria || "";

    document.getElementById(
        "stockProducto"
    ).value =
        tieneControlStock(producto)
            ? producto.stock
            : "";

        "imagenProducto"
    ).value = "";

        document.getElementById(
            "previewImagen"
        );

        preview.classList.remove(
            "oculto"
        );

            "Imagen actual de " +
            producto.nombre;

    } else {

        preview.classList.add(
            "oculto"
        );
    }

    document.getElementById(
        "cancelarEdicion"
    ).classList.remove(
        "oculto"
    );

    document.getElementById(
        "nombreProducto"
    ).focus();
}


/* =========================
   GUARDAR PRODUCTO
========================= */

async function guardarProducto(evento) {

    evento.preventDefault();

    const nombre =
        document.getElementById(
            "nombreProducto"
        ).value.trim();

    const precio =
        document.getElementById(
            "precioProducto"
        ).value;

    const descripcion =
        document.getElementById(
            "descripcionProducto"
        ).value.trim();

    const categoria =
        document.getElementById(
            "categoriaProducto"
        ).value;

    const stockTexto =
        document.getElementById(
            "stockProducto"
        ).value.trim();

    const archivo =
        document.getElementById(
            "imagenProducto"
        ).files[0];

    if (!nombre) {

        document.getElementById(
            "mensajeProducto"
        ).textContent =
            "El nombre es obligatorio.";

        return;
    }

    if (
        precio === "" ||
        Number(precio) < 0
    ) {

        document.getElementById(
            "mensajeProducto"
        ).textContent =
            "El precio es obligatorio.";

        return;
    }

    let imagenBase64 = null;

    if (archivo) {

        try {

            imagenBase64 =
                await comprimirImagen(
                    archivo
                );

        } catch (error) {

            console.error(error);

            document.getElementById(
                "mensajeProducto"
            ).textContent =
                "No se pudo procesar la imagen.";

            return;
        }
    }

    let stock = "";

    if (stockTexto !== "") {

        const numeroStock =
            Number(stockTexto);

        if (
            !Number.isInteger(numeroStock) ||
            numeroStock < 0
        ) {

            document.getElementById(
                "mensajeProducto"
            ).textContent =
                "El stock debe ser un número entero igual o mayor a cero.";

            return;
        }

        stock = numeroStock;
    }

    try {

        if (productoEditandoId) {

            const producto =
                productos.find(
                    p =>
                        p.id ===
                        productoEditandoId
                );

            if (!producto) {
                throw new Error(
                    "Producto no encontrado."
                );
            }

            producto.nombre =
                nombre;

            producto.precio =
                Number(precio);

            producto.descripcion =
                descripcion;

            producto.categoria =
                categoria;

            producto.stock =
                stock;

            /*
               Si no se seleccionó una imagen nueva,
               se conserva la imagen anterior.
            */

            if (imagenBase64) {

                producto.imagen =
                    imagenBase64;
            }

        } else {

            if (!imagenBase64) {

                document.getElementById(
                    "mensajeProducto"
                ).textContent =
                    "Para un producto nuevo tenés que seleccionar una imagen.";

                return;
            }

            productos.push({

                id: generarId(),

                nombre: nombre,

                precio: Number(precio),

                descripcion: descripcion,

                categoria: categoria,

                stock: stock,

                imagen: imagenBase64
            });
        }

        repararIds();

        const datos =
            await guardarEnNPoint();

        productos =
            datos.productos;

        configuracion =
            datos.configuracion;

        completarConfiguracion();

        limpiarFormularioProducto();

        mostrarProductos();
        mostrarCategorias();
        cargarCategoriasFormulario();
        cargarProductosAdmin();

        document.getElementById(
            "mensajeProducto"
        ).textContent =
            "Producto guardado correctamente.";

    } catch (error) {

        console.error(error);

        document.getElementById(
            "mensajeProducto"
        ).textContent =
            "No se pudo guardar el producto.";
    }
}


/* =========================
   COMPRIMIR IMAGEN
========================= */

function comprimirImagen(
    archivo
) {

    return new Promise(
        (resolve, reject) => {

            const lector =
                new FileReader();

            lector.onload =
                function(evento) {

                    const imagen =
                        new Image();

                    imagen.onload =
                        function() {

                            const maximo =
                                1000;

                            let ancho =
                                imagen.width;

                            let alto =
                                imagen.height;

                            if (
                                ancho > maximo ||
                                alto > maximo
                            ) {

                                if (
                                    ancho > alto
                                ) {

                                    alto =
                                        alto *
                                        maximo /
                                        ancho;

                                    ancho =
                                        maximo;

                                } else {

                                    ancho =
                                        ancho *
                                        maximo /
                                        alto;

                                    alto =
                                        maximo;
                                }
                            }

                            const canvas =
                                document.createElement(
                                    "canvas"
                                );

                            canvas.width =
                                Math.round(
                                    ancho
                                );

                            canvas.height =
                                Math.round(
                                    alto
                                );

                            const contexto =
                                canvas.getContext(
                                    "2d"
                                );

                            contexto.drawImage(
                                imagen,
                                0,
                                0,
                                canvas.width,
                                canvas.height
                            );

                            resolve(
                                canvas.toDataURL(
                                    "image/jpeg",
                                    0.75
                                )
                            );
                        };

                    imagen.onerror =
                        reject;

                    imagen.src =
                        evento.target.result;
                };

            lector.onerror =
                reject;

            lector.readAsDataURL(
                archivo
            );
        }
    );
}


/* =========================
   LIMPIAR FORMULARIO
========================= */

function limpiarFormularioProducto() {

    productoEditandoId = null;

    document.getElementById(
        "formProducto"
    ).reset();

    document.getElementById(
        "tituloFormularioProducto"
    ).textContent =
        "Agregar producto";

    document.getElementById(
        "cancelarEdicion"
    ).classList.add(
        "oculto"
    );

    document.getElementById(
        "previewImagen"
    ).classList.add(
        "oculto"
    );

    document.getElementById(
        "previewImagen"
    ).removeAttribute(
        "src"
    );
}


/* =========================
   ELIMINAR PRODUCTO
========================= */

async function eliminarProducto(id) {

    const producto =
        productos.find(
            p => p.id === id
        );

    if (!producto) {
        return;
    }

    const confirmar =
        confirm(
            "¿Querés eliminar el producto " +
            producto.nombre +
            "?"
        );

    if (!confirmar) {
        return;
    }

    const productosAnteriores =
        [...productos];

    productos =
        productos.filter(
            p => p.id !== id
        );

    try {

        const datos =
            await guardarEnNPoint();

        const listaConfirmada =
            Array.isArray(
                datos.productos
            )
                ? datos.productos
                : [];

        const sigueExistiendo =
            listaConfirmada.some(
                p => p.id === id
            );

        if (sigueExistiendo) {

            productos =
                productosAnteriores;

            throw new Error(
                "nPoint todavía contiene el producto."
            );
        }

        productos =
            listaConfirmada;

        mostrarProductos();
        cargarProductosAdmin();
        mostrarCategorias();

        alert(
            "Producto eliminado correctamente."
        );

    } catch (error) {

        console.error(error);

        productos =
            productosAnteriores;

        mostrarProductos();
        cargarProductosAdmin();
        mostrarCategorias();

        alert(
            "No se pudo eliminar el producto de nPoint."
        );
    }
}

/* =========================
   INICIO
========================= */

async function iniciar() {

    try {

        const datos =
            await cargarDesdeNPoint();

        /*
           MUY IMPORTANTE:
           Nunca vaciamos los productos existentes.

           Si nPoint tiene productos, se conservan
           aunque tiendaInicializada no esté presente.
        */

        if (
            datos &&
            Array.isArray(
                datos.productos
            )
        ) {

            productos =
                datos.productos;

            configuracion =
                datos.configuracion ||
                {};

            completarConfiguracion();

        } else {

            /*
               Solo se crea una estructura vacía
               si realmente nPoint no tiene datos.
            */

            productos = [];

            completarConfiguracion();

            await guardarEnNPoint();
        }

        repararIds();

        aplicarConfiguracion();

        mostrarCategorias();

        cargarCategoriasFormulario();

        mostrarProductos();

        mostrarCarrito();

        cargarProductosAdmin();

        document.getElementById(
            "estado"
        ).textContent =
            "Tienda cargada correctamente.";

    } catch (error) {

        console.error(error);

        document.getElementById(
            "estado"
        ).textContent =
            "No se pudo cargar la tienda. Verificá la conexión a Internet.";
    }
}
